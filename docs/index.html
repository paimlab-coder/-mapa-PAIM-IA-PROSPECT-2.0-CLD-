<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PAIM IA Prospect · Acesso</title>
<style>
  :root { --bg:#eef1f5; --card:#ffffff; --ink:#14203a; --muted:#5b6b85; --navy:#08254a; --blue:#0a3d7a; --orange:#f58220; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1522; --card:#12233a; --ink:#e6edf7; --muted:#9db0c9; --navy:#e6edf7; --blue:#4d8fe0; --orange:#f58220; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg);
         color:var(--ink); font:14px/1.5 "IBM Plex Sans","Segoe UI",system-ui,Arial,sans-serif; }
  .card { width:100%; max-width:380px; margin:20px; background:var(--card); border-radius:14px; padding:32px 28px;
          box-shadow:0 10px 30px rgba(8,37,74,.18); border-top:5px solid var(--orange); text-align:center; }
  h1 { margin:0 0 2px; font-size:20px; color:var(--navy); letter-spacing:.3px; }
  p.sub { margin:0 0 22px; color:var(--muted); font-size:13px; }
  .spin { width:34px; height:34px; margin:0 auto 14px; border:4px solid var(--muted); border-top-color:var(--orange);
          border-radius:50%; animation:g 0.9s linear infinite; opacity:.8; }
  @keyframes g { to { transform:rotate(360deg); } }
  #msg { min-height:42px; color:var(--muted); font-size:13px; }
  a.btn { display:inline-block; margin-top:14px; padding:11px 20px; border-radius:8px; background:var(--blue); color:#fff;
          text-decoration:none; font-weight:700; }
  .foot { margin-top:20px; font-size:11px; color:var(--muted); }
</style>
</head>
<body>
<div class="card">
  <h1>PAIM IA PROSPECT</h1>
  <p class="sub">Bertolini Intralogística · acesso restrito</p>
  <div class="spin" id="spin"></div>
  <div id="msg">Abrindo a tela de login…</div>
  <a class="btn" id="go" href="https://paim-ia-prospect-2-0-cld.onrender.com/">Ir para o login</a>
  <noscript><p>Ative o JavaScript ou use o botão acima.</p></noscript>
  <div class="foot">Paim Business Intelligence</div>
</div>

<script>
// Esta página NAO contem o sistema. Ela so acorda o servidor e leva ao login.
// Se o endereco do Render mudar, altere somente esta linha (e o href do botao acima).
var RENDER_URL = 'https://paim-ia-prospect-2-0-cld.onrender.com/';

var msg = document.getElementById('msg');
var tentativas = 0, MAX = 20;           // ate ~60 s esperando o servidor acordar (plano Free dorme)

function ir() { location.replace(RENDER_URL); }

function checar() {
  tentativas++;
  var ctrl = new AbortController();
  var t = setTimeout(function () { ctrl.abort(); }, 8000);
  fetch(RENDER_URL + 'api/health', { cache: 'no-store', signal: ctrl.signal })
    .then(function (r) { clearTimeout(t); if (r.ok) { ir(); } else { proxima(); } })
    .catch(function () { clearTimeout(t); proxima(); });
}

function proxima() {
  if (tentativas >= MAX) { ir(); return; }   // desiste de esperar e abre assim mesmo
  msg.textContent = 'Acordando o servidor… (' + tentativas + '/' + MAX + '). Pode levar até 1 minuto na primeira vez.';
  setTimeout(checar, 3000);
}

checar();
</script>
</body>
</html>
